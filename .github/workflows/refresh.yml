name: refresh

# GitHub drops and delays scheduled runs, so this fires every 30 minutes (cheap: it exits in seconds
# when nothing is due). fetch.py refreshes only when the latest slot (07:40, 11:40, 15:40, 19:40 Cairo)
# has not been served, so a dropped trigger is caught up by the next one.
on:
  schedule:
    - cron: '10,40 4-20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Test filters
        run: python3 -m unittest test_fetch

      - name: Fetch jobs and render page
        id: fetch
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python3 fetch.py

      - name: Save state
        if: steps.fetch.outputs.ran == 'yes'
        run: |
          git config user.name "job-pack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Refresh $(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M') Cairo"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.ran == 'yes'
        with:
          path: docs

      - id: deploy
        if: steps.fetch.outputs.ran == 'yes'
        uses: actions/deploy-pages@v4
